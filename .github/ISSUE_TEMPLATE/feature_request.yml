name: Feature request
description: Suggest an idea or improvement for unu.
title: "[Feature]: "
labels: ["feature", "needs consideration"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        unu is built in spare time, so not every idea will make it in, but every one gets read.
        Check the [Unu Roadmap](https://github.com/orgs/unugames/projects/1) first in case it's already there.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: How do you imagine it working?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would be useful
      description: Who benefits, and how often would you use it?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Alternatives or additional context (optional)
      description: Workarounds you use today, how other launchers handle it, mockups, screenshots.
    validations:
      required: false
