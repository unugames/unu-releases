name: Feature request
description: Suggest an idea or improvement for UNU.
title: "[Feature]: "
labels: ["feature", "needs consideration"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        UNU is built in spare time, so not every idea will make it in, but every one gets read.
        Check the [Unu Roadmap](https://github.com/orgs/unugames/projects/1) first in case it's already there.
  - type: textarea
    id: idea
    attributes:
      label: What would you like UNU to do?
      description: A sentence or two is plenty.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you? (optional)
      description: What you're trying to do, or what gets in the way today.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: Workarounds, how other launchers do it, mockups, screenshots.
    validations:
      required: false
